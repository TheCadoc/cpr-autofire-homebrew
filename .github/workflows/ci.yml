name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run packs
      - run: npm test
      - run: npm run lint
      - run: npm run format:check
      - name: Build and check module.zip
        run: bash .github/scripts/build-zip.sh
