name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the tag and pin the download URL
        run: node .github/scripts/stamp-manifest.mjs
      - name: Compile the compendium packs
        run: npm run packs
      - name: Build module.zip
        run: zip -r module.zip module.json LICENSE README.md scripts styles templates lang packs -x "packs/_source/*"
      - name: Attach module.json and module.zip to the release
        run: gh release upload "$GITHUB_REF_NAME" module.json module.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
